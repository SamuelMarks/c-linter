name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (libclang)
      run: sudo apt-get update && sudo apt-get install -y libclang-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install libclang pytest pytest-cov mypy interrogate
        pip install -e .

    - name: Run tests with coverage
      run: |
        pytest --cov=c_linter --cov-report=xml --cov-fail-under=100

    - name: Run type checking (mypy)
      run: |
        mypy src --strict

    - name: Run documentation coverage (interrogate)
      run: |
        interrogate -v --fail-under 100 src
