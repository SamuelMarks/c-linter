name: 'C Linter'
description: 'Enforce strict C coding standards via libclang AST parsing'
author: 'Your Name'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  files:
    description: 'Files or directories to lint (space-separated)'
    required: false
    default: '.'
  no-windows:
    description: 'Disable Windows format literal #ifdef checks'
    required: false
    default: 'false'
  no-safe-crt:
    description: 'Disable Safe CRT function replacement checks'
    required: false
    default: 'false'
  include:
    description: 'Comma-separated list of include directories (e.g. "include,src/include")'
    required: false
    default: ''
  ignore-returns:
    description: 'Comma-separated list of functions or macros to ignore discarded returns for'
    required: false
    default: ''
  std:
    description: 'C standard version (e.g., c89, c99)'
    required: false
    default: ''
  build-dir:
    description: 'Path to build directory containing compile_commands.json'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated list of glob patterns to exclude'
    required: false
    default: ''
  no-tolerate-c99:
    description: 'Do not tolerate C99 type extensions (like _Bool) in C89 mode'
    required: false
    default: 'false'
  no-header-strategy:
    description: 'Disable auto-injection of standard headers when linting standalone .h files'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install C Linter
      shell: bash
      # github.action_path refers to the directory containing this action.yml
      run: pip install ${{ github.action_path }}

    - name: Run C Linter
      shell: bash
      run: |
        FLAGS=""
        if [ "${{ inputs.no-windows }}" == "true" ] || [ "${{ inputs.no-windows }}" == "True" ]; then
          FLAGS="$FLAGS --no-windows"
        fi

        if [ "${{ inputs.no-safe-crt }}" == "true" ] || [ "${{ inputs.no-safe-crt }}" == "True" ]; then
          FLAGS="$FLAGS --no-safe-crt"
        fi

        if [ -n "${{ inputs.include }}" ]; then
          IFS=',' read -ra INCS <<< "${{ inputs.include }}"
          for i in "${INCS[@]}"; do
            FLAGS="$FLAGS -I $i"
          done
        fi

        if [ -n "${{ inputs.ignore-returns }}" ]; then
          FLAGS="$FLAGS --ignore-returns ${{ inputs.ignore-returns }}"
        fi

        if [ -n "${{ inputs.std }}" ]; then
          FLAGS="$FLAGS --std ${{ inputs.std }}"
        fi

        if [ -n "${{ inputs.build-dir }}" ]; then
          FLAGS="$FLAGS -p ${{ inputs.build-dir }}"
        fi

        if [ -n "${{ inputs.exclude }}" ]; then
          IFS=',' read -ra EXCS <<< "${{ inputs.exclude }}"
          for e in "${EXCS[@]}"; do
            FLAGS="$FLAGS --exclude $e"
          done
        fi

        if [ "${{ inputs.no-tolerate-c99 }}" == "true" ] || [ "${{ inputs.no-tolerate-c99 }}" == "True" ]; then
          FLAGS="$FLAGS --no-tolerate-c99"
        fi

        if [ "${{ inputs.no-header-strategy }}" == "true" ] || [ "${{ inputs.no-header-strategy }}" == "True" ]; then
          FLAGS="$FLAGS --no-header-strategy"
        fi

        c-linter ${{ inputs.files }} $FLAGS
