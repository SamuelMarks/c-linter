[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "c-linter"
version = "0.1.0"
description = "Tools for CI and precommit hooks to verify C codebase standards"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[project.scripts]
c-linter = "c_linter.cli:main"
